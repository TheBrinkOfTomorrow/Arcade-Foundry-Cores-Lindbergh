# The games this core builds, one [[game]] per MAME ROM set. scripts/gen_games.py
# writes the files that list them from this one (CI checks they match), and the
# app's scripts/gen_games.py reads it for the app's catalog. The keys are in
# common/tools/games/afgames.py (CORE_KEYS, BOARDS, CONTROLS).

[[game]]
